<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Goals Sprint — SDG Live Quiz</title>
<style>
:root{
  --bg:#081A36;--bg2:#0D2447;--card:#0F2C56;--line:#20406F;--ink:#F3F7FC;--muted:#9FB4D6;
  --a:#E5243B;--b:#FD9D24;--c:#4C9F38;--d:#26BDE2;--gold:#FFC72C;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:
radial-gradient(circle at 10% -10%,#163561 0,transparent 45%),
radial-gradient(circle at 100% 0,#0E2A52 0,transparent 42%),var(--bg);color:var(--ink)}
#app{min-height:100vh;padding:26px 16px 44px;display:flex;justify-content:center}
.wrap{width:100%;max-width:520px}.hostwrap{max-width:900px}
.eyebrow{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{margin:0}.title{font-size:34px;line-height:1.08;margin-top:8px}.sub{color:var(--muted);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px}
.badge{width:64px;height:64px;border-radius:16px;background:conic-gradient(var(--a),var(--b),var(--c),var(--d),var(--a));display:grid;place-items:center;color:#07192d;font-weight:900;font-size:20px;margin-bottom:16px}
input{width:100%;margin-top:8px;background:#0A2144;border:1.5px solid var(--line);color:var(--ink);padding:15px;border-radius:14px;font-size:17px;outline:none}
input:focus{border-color:var(--d)}
.btn{border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:800;cursor:pointer;width:100%;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}.primary{background:linear-gradient(135deg,var(--d),#1C93B0);color:#04151F}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.link{color:var(--muted);text-decoration:underline;cursor:pointer}
.center{text-align:center}.hidden{display:none!important}
.trail{display:flex;gap:6px;margin-bottom:20px}.seg{flex:1;height:8px;background:#1B3A66;border-radius:6px}.seg.done{background:var(--c)}.seg.wrong{background:#7a2838}.seg.current{background:var(--gold)}
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.timer{width:52px;height:52px;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--gold)}.timer.low{border-color:var(--a);color:var(--a)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:15px}.qtext{font-size:22px;line-height:1.35;font-weight:800}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{min-height:98px;border:0;border-radius:16px;padding:14px;color:#fff;font-weight:800;font-size:15px;text-align:left;display:flex;gap:10px;align-items:center;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18)}.opt:disabled{cursor:default}.opt.selected{outline:4px solid #fff}.opt.dim{opacity:.35}.opt.correct{outline:4px solid #fff}.oa{background:var(--a)}.ob{background:var(--b);color:#2a1800}.oc{background:var(--c)}.od{background:var(--d);color:#04222B}.key{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto}
.wait{padding:32px 18px;text-align:center}.big{font-size:52px;font-weight:900;color:var(--gold)}.good{color:#78dc78}.bad{color:#ff7d90}
.hostgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}
.qrbox{background:#fff;border-radius:18px;padding:16px;display:grid;place-items:center}.qrbox img{width:260px;max-width:100%;height:auto}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border-radius:14px;text-align:center;font-weight:900}.stat small{display:block;font-weight:700;opacity:.85}.barrow{display:grid;grid-template-columns:42px 1fr 52px;gap:10px;align-items:center;margin:12px 0}.barbg{height:28px;background:#0A2144;border-radius:9px;overflow:hidden}.bar{height:100%;border-radius:9px;transition:width .3s}.rankrow{display:flex;gap:12px;align-items:center;background:#0A2144;border:1px solid var(--line);padding:12px 14px;border-radius:12px;margin:8px 0}.rank{width:32px;font-weight:900;color:var(--muted)}.r1{color:var(--gold)}.r2{color:#d9e2ef}.r3{color:#e3a15c}.rankname{flex:1;font-weight:800}.score{color:var(--gold);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900}
.status{padding:12px 14px;border-radius:12px;background:#0A2144;color:var(--muted)}
@media(max-width:720px){.hostgrid{grid-template-columns:1fr}.full{grid-column:auto}.options{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}.title{font-size:29px}}
</style>
</head>
<body><div id="app"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getDatabase,ref,set,get,onValue,remove} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyDoo81hPN32ql8eG7qmAv9-vtNSA4I8c6M",
  authDomain:"sdg-live-quiz.firebaseapp.com",
  databaseURL:"https://sdg-live-quiz-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"sdg-live-quiz",
  storageBucket:"sdg-live-quiz.firebasestorage.app",
  messagingSenderId:"96882101884",
  appId:"1:96882101884:web:bd48ce2c43f84adc7a43f9"
};
const fb=initializeApp(firebaseConfig),db=getDatabase(fb);

const QUESTIONS=[
{q:"How many years remain to achieve the SDGs as of 2026?",o:["2 years","4 years","6 years","10 years"],c:1},
{q:"Which SDG directly addresses reducing inequality within and among countries?",o:["SDG 5 – Gender Equality","SDG 8 – Decent Work and Economic Growth","SDG 10 – Reduced Inequalities","SDG 16 – Peace, Justice and Strong Institutions"],c:2},
{q:"Which renewable energy source is currently the fastest-growing globally?",o:["Hydropower","Geothermal energy","Solar energy","Biomass"],c:2},
{q:"Which sector contributes the most to global food waste?",o:["Retail","Food service","Households","Agriculture"],c:2},
{q:"What does SDG 11 primarily focus on?",o:["Affordable and Clean Energy","Sustainable Cities and Communities","Climate Action","Industry, Innovation and Infrastructure"],c:1},
{q:"Which industry is responsible for the highest share of global plastic pollution?",o:["Construction","Electronics","Packaging","Automotive"],c:2},
{q:"Which challenge most undermines progress on SDG 1?",o:["Growth in renewable energy","Increased urbanization","Persistent inequality and vulnerability to economic shocks","Expansion of international tourism"],c:2},
{q:"Which SDG focuses on responsible consumption and production?",o:["SDG 8","SDG 10","SDG 12","SDG 14"],c:2},
{q:"Which option is highest in the commonly used waste hierarchy?",o:["Recycling","Energy recovery","Prevention","Disposal"],c:2},
{q:"Which SDG focuses specifically on protecting, restoring, and sustainably using terrestrial ecosystems?",o:["SDG 13","SDG 14","SDG 15","SDG 16"],c:2},
{q:"Which action is considered most effective for individuals to reduce their carbon footprint?",o:["Using reusable shopping bags","Reducing high-emission transportation and consumption","Turning off the tap while brushing teeth","Recycling paper"],c:1},
{q:"What is a key indicator of progress under SDG 3?",o:["Forest coverage","Maternal mortality rate","Renewable energy share","Recycling rate"],c:1}
];
const T=15, letters=["A","B","C","D"], colors=["var(--a)","var(--b)","var(--c)","var(--d)"];
const app=document.getElementById("app");
const hostMode=new URLSearchParams(location.search).get("host")==="1";
let serverOffset=0;
onValue(ref(db,".info/serverTimeOffset"),s=>serverOffset=s.val()||0);
const now=()=>Date.now()+serverOffset;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const path=(round,...rest)=>["rounds",round,...rest].join("/");

let P={name:"",id:null,round:null,session:null,answer:null,score:0,correct:0,unsub:null,timer:null};
let H={session:null,unsubSession:null,unsubLobby:null,unsubAnswers:null,unsubPlayers:null,timer:null,lobby:{},answers:{},players:{}};

function trail(qi,results=[]){
  return `<div class="trail">${QUESTIONS.map((_,i)=>{
    let cl="seg"; if(i<results.length)cl+=results[i]?" done":" wrong"; else if(i===qi)cl+=" current";
    return `<div class="${cl}"></div>`}).join("")}</div>`;
}

async function ensureSession(){
  const s=(await get(ref(db,"game/session"))).val();
  if(s&&s.roundId)return s;
  const ns={roundId:uid(),status:"lobby",questionIndex:-1,phase:"lobby",createdAt:now()};
  await set(ref(db,"game/session"),ns); return ns;
}

/* PLAYER */
function renderJoin(msg=""){
 app.innerHTML=`<div class="wrap"><div class="badge">SDG</div><div class="eyebrow">Goals Sprint · Live Quiz</div>
 <h1 class="title">How well do you<br>know the Goals?</h1><p class="sub">Join the live room. The host controls every question.</p>
 <div class="card"><label>Your name</label><input id="nm" maxlength="24" placeholder="e.g. Alex"><button class="btn primary" id="join">Join game</button>${msg?`<p class="bad">${esc(msg)}</p>`:""}</div>
 <p class="center sub" style="margin-top:20px"><a class="link" href="?host=1">Host / projector view →</a></p></div>`;
 document.getElementById("join").onclick=joinGame;
}
async function joinGame(){
 const name=document.getElementById("nm").value.trim(); if(!name)return document.getElementById("nm").focus();
 const s=await ensureSession();
 if(s.phase!=="lobby")return renderJoin("A game is already in progress. Please wait for the next round.");
 P.name=name;P.id=uid();P.round=s.roundId;P.score=0;P.correct=0;P.answer=null;
 await set(ref(db,path(P.round,"lobby",P.id)),{name,joinedAt:now()});
 await set(ref(db,path(P.round,"players",P.id)),{name,score:0,correct:0,finished:false,joinedAt:now()});
 listenPlayer();
}
function listenPlayer(){
 if(P.unsub)P.unsub();
 P.unsub=onValue(ref(db,"game/session"),snap=>{
   const s=snap.val(); if(!s)return;
   if(P.round&&s.roundId!==P.round){ if(P.unsub)P.unsub(); renderJoin("A new round is open. Please enter your name again."); return; }
   const prev=P.session; P.session=s;
   if(s.phase==="lobby")renderLobby();
   if(s.phase==="question" && (!prev||prev.phase!=="question"||prev.questionIndex!==s.questionIndex)){P.answer=null;renderPlayerQuestion();}
   if(s.phase==="result" && (!prev||prev.phase!=="result"||prev.questionIndex!==s.questionIndex))loadAndRenderResult();
   if(s.phase==="final")renderPlayerFinal();
 });
}
function renderLobby(){
 app.innerHTML=`<div class="wrap"><div class="badge">SDG</div><div class="eyebrow">You're in, ${esc(P.name)}</div><h1 class="title">Waiting for the host…</h1><div class="card wait"><div class="big">✓</div><p class="sub">Stay on this page. Question 1 will appear automatically.</p></div></div>`;
}
function renderPlayerQuestion(){
 clearInterval(P.timer);
 const s=P.session,q=QUESTIONS[s.questionIndex];
 app.innerHTML=`<div class="wrap">${trail(s.questionIndex)}
 <div class="qtop"><span class="mono sub">QUESTION ${s.questionIndex+1} / ${QUESTIONS.length}</span><div class="timer" id="tm">15</div></div>
 <div class="qcard"><div class="qtext">${esc(q.q)}</div></div>
 <div class="options">${q.o.map((o,i)=>`<button class="opt o${["a","b","c","d"][i]}" data-i="${i}"><span class="key">${letters[i]}</span>${esc(o)}</button>`).join("")}</div>
 <div id="ansmsg" class="center sub" style="margin-top:16px"></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>submitAnswer(+b.dataset.i));
 tickPlayer();
 P.timer=setInterval(tickPlayer,200);
}
function tickPlayer(){
 const el=document.getElementById("tm"); if(!el||!P.session)return;
 const left=Math.max(0,Math.ceil((P.session.endsAt-now())/1000));el.textContent=left;el.classList.toggle("low",left<=5);
 if(left<=0){clearInterval(P.timer);document.querySelectorAll(".opt").forEach(b=>b.disabled=true);const m=document.getElementById("ansmsg");if(m&&!P.answer)m.textContent="Time's up — waiting for results…";}
}
async function submitAnswer(choice){
 if(P.answer||now()>P.session.endsAt)return;
 const qi=P.session.questionIndex,q=QUESTIONS[qi],remaining=Math.max(0,P.session.endsAt-now());
 const correct=choice===q.c,points=correct?500+Math.round(500*(remaining/(T*1000))):0;
 P.answer={choice,correct,points};
 document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===choice)b.classList.add("selected")});
 document.getElementById("ansmsg").textContent="Answer locked ✓";
 await set(ref(db,path(P.round,"answers",qi,P.id)),{name:P.name,choice,correct,points,answeredAt:now()});
 P.score+=points;if(correct)P.correct++;
 await set(ref(db,path(P.round,"players",P.id)),{name:P.name,score:P.score,correct:P.correct,finished:false,joinedAt:now()});
}
async function loadAndRenderResult(){
 clearInterval(P.timer);
 const qi=P.session.questionIndex,q=QUESTIONS[qi];
 let a=P.answer;
 if(!a){
   const snap=await get(ref(db,path(P.round,"answers",qi,P.id))); a=snap.val();
 }
 const isCorrect=!!(a&&a.correct),points=a?a.points:0;
 app.innerHTML=`<div class="wrap">${trail(qi)}
 <div class="card center" style="padding:34px 22px"><div class="big ${isCorrect?"good":"bad"}">${isCorrect?"✓":"✕"}</div>
 <h1 class="title">${isCorrect?"Correct!":"Not quite"}</h1>
 <p class="sub">${a?`You earned <b>${points}</b> points.`:"You did not submit an answer."}</p>
 <p class="sub">Correct answer: <b>${letters[q.c]}. ${esc(q.o[q.c])}</b></p>
 <div class="score" style="font-size:28px;margin-top:18px">Total: ${P.score}</div>
 <p class="sub">Waiting for the host to continue…</p></div></div>`;
}
async function renderPlayerFinal(){
 clearInterval(P.timer);
 await set(ref(db,path(P.round,"players",P.id)),{name:P.name,score:P.score,correct:P.correct,finished:true,finishedAt:now()});
 app.innerHTML=`<div class="wrap"><div class="card center" style="padding:38px 22px"><div class="eyebrow">Quiz complete</div><h1 class="title">${esc(P.name)}</h1>
 <div class="big">${P.score}</div><p class="sub">${P.correct} / ${QUESTIONS.length} correct</p><p class="sub">The final ranking is shown on the host screen.</p></div></div>`;
}

/* HOST */
async function renderHost(){
 try{
   const s=await ensureSession();
   H.session=s;

   app.innerHTML=`<div class="wrap hostwrap"><div class="eyebrow">Host / Projector</div><h1 class="title">Goals Sprint — SDG Quiz</h1>
   <div class="hostgrid">
   <div class="card">
   <h3>Scan to join</h3>
   <div class="qrbox" id="qrbox" style="margin-top:14px;min-height:292px;">
     <div class="center" id="qrplaceholder" style="color:#081A36;font-weight:800;">QR code not generated yet</div>
   </div>
   <p class="sub center" id="joinurl"></p>
   <button class="btn primary" id="generateQrBtn">Generate QR Code</button>
 </div>
   <div class="card"><h3>Game controls</h3><div class="status" id="hoststatus" style="margin-top:14px">Lobby open</div><div id="controls">
     <button class="btn primary" id="startFallback">Start game for everyone</button>
     <button class="btn ghost" id="resetFallback">Reset / New round</button>
   </div></div>
   <div class="card full"><div id="hostmain"><div class="center"><div class="big">0</div><h2>Players joined</h2><p class="sub">Waiting for players to scan the QR code.</p></div></div></div></div></div>`;

   const joinURL=location.href.split("?")[0];
   document.getElementById("joinurl").textContent=joinURL;

   document.getElementById("generateQrBtn").onclick=()=>{
     const box=document.getElementById("qrbox");
     box.innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data=${encodeURIComponent(joinURL)}"
       alt="QR code to join the quiz" style="width:260px;max-width:100%;height:auto;">`;
   };

   document.getElementById("startFallback").onclick=startQuestion0;
   document.getElementById("resetFallback").onclick=newRound;

   bindRoundListeners();
   renderHostState();
   listenHost();
 }catch(err){
   console.error("Host initialization failed",err);
   app.innerHTML=`<div class="wrap hostwrap"><div class="card center">
     <h2>Host connection error</h2>
     <p class="sub">${esc(err && err.message ? err.message : "Could not connect to Firebase.")}</p>
     <button class="btn primary" onclick="location.reload()">Try again</button>
   </div></div>`;
 }
}
function cleanupHostListeners(){
 if(H.unsubSession){H.unsubSession();H.unsubSession=null;}
 if(H.unsubLobby){H.unsubLobby();H.unsubLobby=null;}
 if(H.unsubAnswers){H.unsubAnswers();H.unsubAnswers=null;}
 if(H.unsubPlayers){H.unsubPlayers();H.unsubPlayers=null;}
 clearInterval(H.timer);
}
function listenHost(){
 if(H.unsubSession){H.unsubSession();H.unsubSession=null;}
 clearInterval(H.timer);

 H.unsubSession=onValue(ref(db,"game/session"),snap=>{
   const next=snap.val();
   if(!next)return;
   H.session=next;
   bindRoundListeners();
   renderHostState();
 },err=>{
   console.error("Session listener failed",err);
   const st=document.getElementById("hoststatus");
   if(st)st.textContent="Firebase connection error — refresh the page.";
 });

 H.timer=setInterval(hostTick,250);
}
let boundRound=null,boundQI=null;
function bindRoundListeners(){
 const s=H.session;if(!s)return;
 if(boundRound!==s.roundId){
   if(H.unsubLobby)H.unsubLobby();if(H.unsubPlayers)H.unsubPlayers();if(H.unsubAnswers)H.unsubAnswers();
   boundRound=s.roundId;boundQI=null;
   H.unsubLobby=onValue(ref(db,path(s.roundId,"lobby")),x=>{H.lobby=x.val()||{};renderHostState()},e=>console.error("Lobby listener",e));
   H.unsubPlayers=onValue(ref(db,path(s.roundId,"players")),x=>{H.players=x.val()||{};renderHostState()},e=>console.error("Players listener",e));
 }
 if(s.questionIndex>=0 && boundQI!==s.questionIndex){
   if(H.unsubAnswers)H.unsubAnswers();boundQI=s.questionIndex;
   H.unsubAnswers=onValue(ref(db,path(s.roundId,"answers",s.questionIndex)),x=>{H.answers=x.val()||{};renderHostState()},e=>console.error("Answers listener",e));
 }
}
async function hostTick(){
 const s=H.session;if(!s)return;
 if(s.phase==="question"&&s.endsAt&&now()>=s.endsAt){
   await set(ref(db,"game/session"),{...s,phase:"result",resultAt:now()});
 }
 const tm=document.getElementById("hosttimer");
 if(tm&&s.phase==="question"){tm.textContent=Math.max(0,Math.ceil((s.endsAt-now())/1000))}
}
function renderHostState(){
 const s=H.session;if(!s||!document.getElementById("hostmain"))return;
 const nLobby=Object.keys(H.lobby||{}).length,nPlayers=Object.keys(H.players||{}).length,nAns=Object.keys(H.answers||{}).length;
 document.getElementById("hoststatus").textContent =
   s.phase==="lobby"?`Lobby open — ${nLobby} player${nLobby===1?"":"s"} joined`:
   s.phase==="question"?`Question ${s.questionIndex+1} live — ${nAns}/${nPlayers} answered`:
   s.phase==="result"?`Question ${s.questionIndex+1} results`:"Final leaderboard";

 const ctl=document.getElementById("controls"),main=document.getElementById("hostmain");
 if(s.phase==="lobby"){
   ctl.innerHTML=`<button class="btn primary" id="start">Start game for everyone</button><button class="btn ghost" id="reset">Reset / New round</button>`;
   main.innerHTML=`<div class="center"><div class="big">${nLobby}</div><h2>Players joined</h2><p class="sub">When everyone is ready, press Start.</p></div>`;
   document.getElementById("start").onclick=startQuestion0;document.getElementById("reset").onclick=newRound;
 }else if(s.phase==="question"){
   ctl.innerHTML=`<button class="btn ghost" id="reset">Reset / New round</button>`;
   document.getElementById("reset").onclick=newRound;
   const q=QUESTIONS[s.questionIndex];
   main.innerHTML=`<div class="qtop"><span class="mono sub">QUESTION ${s.questionIndex+1} / ${QUESTIONS.length}</span><div class="timer" id="hosttimer">${Math.max(0,Math.ceil((s.endsAt-now())/1000))}</div></div>
   <div class="qcard"><div class="qtext">${esc(q.q)}</div></div><div class="center"><div class="big">${nAns}</div><p class="sub">answers received</p></div>`;
 }else if(s.phase==="result"){
   const q=QUESTIONS[s.questionIndex],counts=[0,0,0,0];Object.values(H.answers||{}).forEach(a=>{if(Number.isInteger(a.choice)&&a.choice>=0&&a.choice<4)counts[a.choice]++});
   const max=Math.max(1,...counts);
   ctl.innerHTML=`<button class="btn primary" id="next">${s.questionIndex===QUESTIONS.length-1?"Show final leaderboard":"Next question"}</button><button class="btn ghost" id="reset">Reset / New round</button>`;
   document.getElementById("next").onclick=nextFromResult;document.getElementById("reset").onclick=newRound;
   main.innerHTML=`<h2 style="margin-bottom:8px">Answer distribution</h2><p class="sub">Correct answer: <b>${letters[q.c]}. ${esc(q.o[q.c])}</b></p>
   ${q.o.map((o,i)=>`<div class="barrow"><b>${letters[i]}</b><div class="barbg"><div class="bar" style="width:${counts[i]/max*100}%;background:${colors[i]}"></div></div><div class="score">${counts[i]}</div></div>`).join("")}
   <p class="sub">${nAns} answer${nAns===1?"":"s"} submitted.</p>`;
 }else if(s.phase==="final"){
   ctl.innerHTML=`<button class="btn primary" id="reset">Start a new round</button>`;document.getElementById("reset").onclick=newRound;
   const arr=Object.values(H.players||{}).filter(p=>p&&p.name).sort((a,b)=>(b.score||0)-(a.score||0)||(b.correct||0)-(a.correct||0));
   main.innerHTML=`<div class="center"><div class="eyebrow">Final results</div><h2 style="font-size:32px;margin:8px 0 18px">🏆 Leaderboard</h2></div>
   ${arr.length?arr.slice(0,10).map((p,i)=>`<div class="rankrow"><div class="rank ${i===0?"r1":i===1?"r2":i===2?"r3":""}">${i+1}</div><div class="rankname">${esc(p.name)} <span class="sub">(${p.correct||0}/${QUESTIONS.length})</span></div><div class="score">${p.score||0}</div></div>`).join(""):"<p class='sub center'>No scores submitted.</p>"}`;
 }
}
async function startQuestion0(){
 try{
   const snap=await get(ref(db,"game/session"));
   const s=snap.val()||H.session||await ensureSession();
   await set(ref(db,"game/session"),{
     ...s,
     status:"started",
     phase:"question",
     questionIndex:0,
     startedAt:now(),
     endsAt:now()+T*1000
   });
 }catch(err){
   console.error("Start failed",err);
   alert("Could not start the game. Please refresh the host page and try again.");
 }
}
async function nextFromResult(){
 const s=H.session;
 if(s.questionIndex>=QUESTIONS.length-1){await set(ref(db,"game/session"),{...s,phase:"final",finishedAt:now()});return}
 const ni=s.questionIndex+1;H.answers={};
 await set(ref(db,"game/session"),{...s,phase:"question",questionIndex:ni,startedAt:now(),endsAt:now()+T*1000});
}
async function newRound(){
 if(!confirm("Start a completely new round? The previous round will not appear in the new leaderboard."))return;
 const ns={roundId:uid(),status:"lobby",phase:"lobby",questionIndex:-1,createdAt:now()};
 H.lobby={};H.answers={};H.players={};boundRound=null;boundQI=null;
 await set(ref(db,"game/session"),ns);
}

if(hostMode)renderHost();else renderJoin();
</script>
</body></html>
